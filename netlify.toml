[build]
  publish = "."
  # Pre-renders content/site.json into index.html + writes sitemap.xml (SEO)
  command = "node build.js"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"


# Learning platform (VPS) served at aribaacademy.com/learn
[[redirects]]
from = "/learn"
to = "https://app.aribaacademy.com/learn"
status = 200
force = true

[[redirects]]
from = "/learn/*"
to = "https://app.aribaacademy.com/learn/:splat"
status = 200
force = true

[[headers]]
  for = "/thank-you*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Send www and the Netlify subdomain to the main domain (one canonical URL)
[[redirects]]
  from = "https://www.aribaacademy.com/*"
  to = "https://aribaacademy.com/:splat"
  status = 301
  force = true

# Tell Bing / IndexNow about new or changed pages after each deploy
[[plugins]]
  package = "./netlify/plugins/indexnow"
  [plugins.inputs]
    siteUrl = "https://aribaacademy.com"
    key = "8441638cea2864468caf56a8986c845c"
