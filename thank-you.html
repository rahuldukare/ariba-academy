<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank you | Ariba Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .ty { min-height: 100vh; display: grid; place-items: center; background: var(--navy); color: #fff; text-align: center; padding: 24px; }
    .ty-box { max-width: 520px; }
    .ty-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-size: 2.2rem; margin: 0 auto 20px; font-weight: 800; }
    .ty p { color: #cbd5e1; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main class="ty">
    <div class="ty-box">
      <div class="ty-icon">✓</div>
      <h1>Thank you!</h1>
      <p>Your enquiry has been received. Our team will contact you within 24 hours with the payment link and batch details.</p>
      <p><a href="/" class="btn">Back to home</a></p>
    </div>
  </main>
</body>
</html>
